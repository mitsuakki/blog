version: 2

updates:
  # Ruby / Bundler
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris
    labels:
      - dependencies
      - ruby
    commit-message:
      prefix: "chore(deps): "
    open-pull-requests-limit: 5
    target-branch: main

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci): "
    target-branch: main
