name: Stale issue/PR sweep

on:
  schedule:
    - cron: "17 3 * * 1"  # Every Monday at 03:17 UTC
  workflow_dispatch:

jobs:
  stale:
    name: Close stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          # Issues
          days-before-issue-stale: 90
          days-before-issue-close: 14
          stale-issue-label: stale
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had recent activity. It will be closed in 14 days if no further
            activity occurs. Comment to keep it open.

          # PRs
          days-before-pr-stale: 45
          days-before-pr-close: 7
          stale-pr-label: stale
          stale-pr-message: >
            This PR has been automatically marked as stale due to inactivity.
            It will be closed in 7 days unless updated.

          # Don't touch these
          exempt-issue-labels: pinned,security,keep
          exempt-pr-labels: pinned,security,keep

          # Cleanup
          delete-branch: true
