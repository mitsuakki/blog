name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build Jekyll site
  build:
    name: Build Jekyll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --future
        env:
          JEKYLL_ENV: production

      - name: Check for broken HTML
        run: |
          grep -rL '<html' _site/*.html 2>/dev/null || true
          # Fail if any HTML is empty
          find _site -name '*.html' -size 0 | tee /dev/stderr | grep -q . && exit 1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
          retention-days: 1

  # Check internal links
  links:
    name: Link checker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site/

      - uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --config .lychee.toml
            --no-progress
            _site/**/*.html
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Lint markdown
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            _posts/*.md
            *.md
            fr/*.md

      - name: Check YAML syntax
        run: |
          python3 -c "import yaml; yaml.safe_load(open('_config.yml'))"
