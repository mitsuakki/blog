name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "_posts/**"
      - "_layouts/**"
      - "_includes/**"
      - "_projects/**"
      - "assets/**"
      - "*.html"
      - "*.md"
      - "_config.yml"
      - "Gemfile"
      - "_scripts/**"
  workflow_dispatch:
  schedule:
    # Rebuild every 6 hours to catch README changes from other repos
    - cron: "13 */6 * * *"

# Sets permissions of the GITHUB_TOKEN to allow Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Sync projects from GitHub
        run: ruby _scripts/sync_projects.rb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build site
        run: bundle exec jekyll build --future
        env:
          JEKYLL_ENV: production

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/projects_cache.json
          git diff --staged --quiet || git commit -m "chore: update projects cache [skip ci]"
          git push origin main

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - uses: actions/deploy-pages@v4
        id: deployment
