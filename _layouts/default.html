<!DOCTYPE html>
<html lang="{% if page.lang %}{{ page.lang }}{% else %}en{% endif %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta name="author" content="{{ site.author.name }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }} RSS" href="{{ '/feed.xml' | relative_url }}">
  {% feed_meta %}
  {% seo %}
</head>
<body>
  <div class="container">
    <nav class="top-nav">
      <a href="{{ '/' | relative_url }}">~/</a>
      <a href="{{ '/about/' | relative_url }}">~/about</a>
      <a href="{{ '/projects/' | relative_url }}">~/projects</a>
      <a href="{{ '/feed.xml' | relative_url }}">~/rss</a>
      <a href="https://github.com/mitsuakki">~/github</a>
    </nav>
    <main>
      {{ content }}
    </main>
    <footer>
      <span>
        <span class="prompt">$</span>
        <a href="https://github.com/mitsuakki">{{ site.author.name }}</a>
        . no trackers, just text &amp; code
      </span>
      <span class="footer-links">
        <a href="https://github.com/mitsuakki">gh</a>
        <a href="https://linkedin.com/in/alexis-dauge">li</a>
      </span>
    </footer>
  </div>
  <script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    svg: { fontCache: 'global' },
    options: { enableMenu: false },
    startup: {
      ready: function() {
        // Convert ```math code blocks to $$ for MathJax
        // Handles both Rouge-wrapped and bare code blocks
        document.querySelectorAll('pre code.language-math').forEach(function(el) {
          var div = document.createElement('div');
          div.textContent = '$$' + el.textContent + '$$';
          var wrapper = el.closest('div.highlighter-rouge') || el.closest('pre');
          if (wrapper) wrapper.replaceWith(div);
        });
        MathJax.startup.defaultReady();
      }
    }
  };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
  // Convert ```mermaid code blocks to <pre class="mermaid">
  // Handles both Rouge-wrapped and bare code blocks
  document.querySelectorAll('pre code.language-mermaid').forEach(function(el) {
    var pre = document.createElement('pre');
    pre.className = 'mermaid';
    pre.textContent = el.textContent;
    // Replace the closest wrapper (Rouge div or the pre itself)
    var wrapper = el.closest('div.highlighter-rouge') || el.closest('pre');
    if (wrapper) wrapper.replaceWith(pre);
  });
  mermaid.initialize({ startOnLoad: true, theme: 'dark' });
  if (document.querySelectorAll('pre.mermaid').length > 0) {
    mermaid.run();
  }

  // Copy button on code blocks
  document.querySelectorAll('.post-content pre:not(.mermaid), .post-content .highlight pre').forEach(function(pre) {
    var btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'copy';
    btn.addEventListener('click', function() {
      var code = pre.textContent;
      navigator.clipboard.writeText(code).then(function() {
        btn.textContent = 'copied!';
        btn.classList.add('copied');
        setTimeout(function() { btn.textContent = 'copy'; btn.classList.remove('copied'); }, 2000);
      });
    });
    pre.appendChild(btn);
  });

  // Convert > [!NOTE] / > [!IMPORTANT] / etc. blockquotes to callout divs
  var CALLOUTS = {
    'NOTE':      { icon: 'i', cls: 'callout-note' },
    'IMPORTANT': { icon: '!', cls: 'callout-important' },
    'WARNING':   { icon: '!!', cls: 'callout-warning' },
    'CAUTION':   { icon: '!!!', cls: 'callout-caution' },
    'TIP':       { icon: '~', cls: 'callout-tip' }
  };
  document.querySelectorAll('.post-content blockquote, .post-content blockquote').forEach(function(bq) {
    var text = bq.textContent.trim();
    for (var key in CALLOUTS) {
      if (text.indexOf('[!' + key + ']') === 0) {
        var div = document.createElement('div');
        div.className = 'callout ' + CALLOUTS[key].cls;
        var inner = bq.innerHTML.replace(/\[\!' + key + '\]\s*/, '');
        var clean = inner.replace(new RegExp('\\[\\!' + key + '\\]\\s*', 'i'), '');
        div.innerHTML = '<span class="callout-label">' + key + '</span>' + clean;
        bq.replaceWith(div);
        break;
      }
    }
  });
  </script>
</body>
</html>
