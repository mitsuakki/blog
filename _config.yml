# Reverse-engineering blog. GitHub Pages + Jekyll
title: blog de mitsuakki
tagline: reverse engineering & low-level dev
description: >-
  Notes on reverse engineering, deobfuscation, OS internals,
  and tooling. By Alexis M. Daugé.

url: "https://mitsuakki.github.io"
baseurl: "/blog"
author:
  name: Alexis M. Daugé
  github: mitsuakki
  linkedin: alexis-dauge

# Build
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:title/

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project
  - scope:
      path: ""
    values:
      layout: default

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - _scripts/

# GitHub Pages gems
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - kramdown-parser-gfm
